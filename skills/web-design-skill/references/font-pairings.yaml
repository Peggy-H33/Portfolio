version: 2
purpose: "Structural typography routes for specimen generation; never a list of preselected families."
policy:
  family_selection: "unlocked until real-copy rendering, language coverage, license, and fallback checks pass"
  chinese_owner: "motion-site-chinese-web-design-v6 when active"
  active_family_range: [2, 4]
  occurrence_limit: null
  prohibited_shortcut: "Do not bind a visual style label to an exact font family or a fixed display/text pair."

routes:
  - id: engineered-editorial
    use_when: [precision, infrastructure, architecture, technical-culture]
    hero_attributes: [controlled-width, decisive-silhouette, strong-distance-read]
    section_attributes: [repeatable-rhythm, clear-hierarchy, optional-character-shift]
    accent_attributes: [compact, legible-at-final-size, state-aware]
    reading_attributes: [stable-punctuation, comfortable-measure, complete-script-coverage]

  - id: handwritten-cinematic
    use_when: [music, film, culture, fashion, authorial-campaign]
    hero_attributes: [calligraphic-or-handwritten, high-gesture, frame-aware]
    section_attributes: [script-or-expressive-display, chapter-specific-cadence]
    accent_attributes: [signature-echo, short-phrase-only-unless-tested]
    reading_attributes: [quiet, high-coverage, rhythmically-compatible]

  - id: playful-consumer
    use_when: [consumer-tech, lifestyle, youth, food, education]
    hero_attributes: [playful-or-rounded, memorable-counterforms, friendly-energy]
    section_attributes: [variable-emphasis, modular, not-card-template-driven]
    accent_attributes: [sticker-like-or-handwritten, clear-action-silhouette]
    reading_attributes: [open-apertures, generous-leading, strong-mobile-clarity]

  - id: archival-literary
    use_when: [publishing, heritage, exhibition, longform-editorial]
    hero_attributes: [historical-or-calligraphic-character, measured-drama]
    section_attributes: [editorial-contrast, deliberate-punctuation]
    accent_attributes: [annotation-like, provenance-aware, restrained-but-not-generic]
    reading_attributes: [longform-tested, complete-punctuation, locale-correct]

  - id: experimental-digital
    use_when: [cyberpunk, digital-art, gaming, speculative-interface]
    hero_attributes: [experimental-silhouette, controlled-distortion, bright-dark-tested]
    section_attributes: [alternate-geometry, chapter-signal, not-a-hero-clone]
    accent_attributes: [pixel-mono-or-expressive-display, final-size-verified]
    reading_attributes: [neutral-or-humanist-control, mixed-script-tested]

notes:
  - "Routes describe glyph behavior and hierarchy. They are inputs to the lab, not recommendations to download a named family."
  - "A distributed page may use expressive typography in section headings, quotes, brand marks, CTA phrases, navigation accents, captions, labels, badges, and numbers."
  - "Long paragraphs, legal copy, inputs, errors, and critical transactions are reading-protected by default; exceptions require rendered legibility evidence."
