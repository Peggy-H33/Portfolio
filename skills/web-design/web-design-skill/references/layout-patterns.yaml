version: 1
patterns:
  - id: edge-thesis-fullbleed
    hero: "copy anchored to one outer grid edge; video full-bleed with opposite focal subject"
    chapters: "alternating contained media and narrow reading columns"
    best_for: [product-launch, technology-story, cinematic-campaign]
    choose_when: "video has a stable empty side across breakpoints"
    reject_when: "subject crosses the copy zone or central action is required"
    compatible_hero_modes: [cinematic-full-bleed, near-full-bleed]
  - id: bottom-anchored-editorial
    hero: "headline and action rest near lower edge over a full-bleed field; subject remains upper/off-axis"
    chapters: "large pull-quote rhythm, image/video plates, sparse annotations"
    best_for: [editorial, architecture, fashion]
    choose_when: "vertical depth and a strong upper subject create a natural lower safe zone"
    reject_when: "mobile browser chrome or captions compromise lower safe area"
    compatible_hero_modes: [cinematic-full-bleed, near-full-bleed]
  - id: contained-film-margin-rail
    hero: "media in a large explicit-ratio frame; copy and metadata use a side rail"
    chapters: "captioned film plates with measured text intervals"
    best_for: [documentary, research, craft, architecture]
    choose_when: "media must not be cover-cropped"
    reject_when: "brief requires immediate full-bleed immersion"
    compatible_hero_modes: [contained-explicit]
  - id: sticky-chapter-observatory
    hero: "short thesis followed by a sticky media viewport and scrolling chapters"
    chapters: "each chapter swaps a distinct local video/poster and annotation"
    best_for: [process, system-explainer, long-form-product]
    choose_when: "there are at least three meaningful narrative beats"
    reject_when: "mobile/low-power performance or content length cannot support it"
    compatible_hero_modes: [cinematic-full-bleed, near-full-bleed]
  - id: typographic-poster-cutaway
    hero: "large off-grid display type paired with a sharply cropped peripheral video window"
    chapters: "poster-like statements alternate with detailed normal-flow media"
    best_for: [events, music, creative-tools, campaigns]
    choose_when: "typography is the thesis and media can be supporting"
    reject_when: "product subject must remain fully visible or the brief locks a large/full-bleed video background"
    compatible_hero_modes: [contained-explicit]
  - id: quiet-luxury-sequence
    hero: "restrained type at edge, expansive media, generous unoccupied field"
    chapters: "full-width material films separated by small factual copy"
    best_for: [jewelry, hospitality, premium-real-estate]
    choose_when: "high quality media and factual restraint exist"
    reject_when: "dense product comparison or dashboard behavior is required"
    compatible_hero_modes: [cinematic-full-bleed, near-full-bleed]
  - id: centered-orbit-exception
    hero: "centered thesis inside a verified central quiet zone; subject/effects orbit periphery"
    chapters: "subsequent sections switch alignment to prevent monotony"
    best_for: [abstract-science, cosmic, ambient-art]
    choose_when: "frame sampling proves central quiet space at all target ratios"
    reject_when: "a central subject, face, product, or diagram exists"
    compatible_hero_modes: [cinematic-full-bleed, near-full-bleed]
rules:
  - "Filter candidates by the locked hero_contract before choosing different pattern families."
  - "When cinematic-full-bleed is locked, at least two candidates and the selected candidate must preserve it."
  - "Do not use typographic-poster-cutaway as a fallback for a bad full-bleed generation; regenerate the asset."
  - "Do not select centered-orbit-exception without sampled-frame evidence."
  - "A page may combine patterns by chapter when the transition is documented."
